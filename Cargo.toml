[package]
name = "squiddy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
convert_case = "0.6.0"
gio = "0.19.8"
git2 = "0.19.0"
indoc = "2.0.5"
itertools = "0.13.0"
libappstream = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.12.0"
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
